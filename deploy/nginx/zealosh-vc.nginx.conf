# ==============================================================================
# Zealosh LMS — Video Conferencing Media Node Nginx Configuration Template
# Server 2: vc.staging.zealosh.com (BigBlueButton 4.0 Media Node)
# WebRTC Signaling & FreeSWITCH/Mediasoup Bridge
# ==============================================================================

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vc.${ZEALOSH_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/bigbluebutton-default;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Media Node HTTPS Signaling Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vc.${ZEALOSH_DOMAIN};

    # TLS Certificates (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/vc.${ZEALOSH_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vc.${ZEALOSH_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "HIGH:!aNULL:!MD5";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body limit for presentation slide uploads (PDF/PPTX)
    client_max_body_size 100M;

    # BigBlueButton HTML5 Client & Web Application
    location / {
        root /var/www/bigbluebutton-default;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # BigBlueButton Core REST API
    location /bigbluebutton/api/ {
        proxy_pass http://127.0.0.1:8090/bigbluebutton/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # HTML5 WebSocket Signaling Engine
    location /html5client/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }

    # Mediasoup / Kurento WebRTC Signaling Bridge
    location /bbb-webrtc-sfu/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

