events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream services
    upstream nextjs_hub {
        server zealosh-hub:3000;
        keepalive 32;
    }

    upstream moodle_engine {
        server zealosh-moodle:80;
        keepalive 32;
    }

    # Staging Virtual Host: Strictly accepts only lms.staging.zealosh.com and local ingress
    server {
        listen 80;
        server_name lms.staging.zealosh.com localhost;

        client_max_body_size 256M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Zealosh Learning Engine (Self-Hosted Moodle)
        location /learn-engine/ {
            proxy_pass http://moodle_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /learn-engine;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # 2. OpenID Connect Discovery & OAuth2 Endpoints
        location /.well-known/ {
            proxy_pass http://nextjs_hub/.well-known/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /api/oauth/ {
            proxy_pass http://nextjs_hub/api/oauth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 3. Progressive Web App Service Worker (Strictly Bypass Caching on sw.js)
        location = /sw.js {
            proxy_pass http://nextjs_hub/sw.js;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 4. Zealosh Live Classroom Backward-Compatible Proxy to Next.js Hub /live/ Stage
        # NOTE: BigBlueButton WebRTC media runs directly on dedicated Server 2 (media.staging.zealosh.com).
        # This location provides a backward-compatible proxy on Server 1 into the Next.js /live/ interactive stage.
        location /classroom/ {
            proxy_pass http://nextjs_hub/live/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 5. Zealosh Core Hub (Next.js 14 App Router)
        location / {
            proxy_pass http://nextjs_hub;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
