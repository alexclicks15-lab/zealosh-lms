# ==============================================================================
# Zealosh Learning Engine — Apache VirtualHost for Moodle 5.3 LTS
# Mandatory Security Layout: DocumentRoot points strictly to /var/www/html/public
# Protects config.php, core libraries, and moodledata from direct HTTP exposure
# ==============================================================================

<VirtualHost *:80>
    ServerName lms.staging.zealosh.com
    ServerAlias localhost 127.0.0.1
    ServerAdmin admin@zealosh.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Moodle 5.1+ Front-Controller Router (r.php)
        DirectoryIndex index.php
        FallbackResource /r.php

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ /r.php [QSA,L]
        </IfModule>
    </Directory>

    # Explicitly prohibit direct web access to sensitive file patterns if requested
    <FilesMatch "(config\.php|\.git|\.env|composer\.(json|lock))">
        Require all denied
    </FilesMatch>

    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined
</VirtualHost>
