; Production PHP 8.3 INI Configuration for Moodle 5.3 LTS
; Optimized for Zealosh Learning Engine running on Supabase PostgreSQL 17

max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
memory_limit = 512M
post_max_size = 256M
upload_max_filesize = 256M

; OPcache settings (Mandatory for Moodle 5.3 performance)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 16211
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.save_comments = 1
opcache.validate_timestamps = 1

; Session & Security Settings
session.gc_maxlifetime = 14400
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_only_cookies = 1
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
