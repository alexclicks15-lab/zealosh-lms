#cloud-config
# Zealosh LMS — Server 1 (Application & Moodle Host) Cloud-Init Configuration
# Target OS: Ubuntu 22.04 LTS (x86_64)

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - ufw
  - wget
  - htop
  - fail2ban
  - unattended-upgrades
  - systemd-timesyncd

groups:
  - docker

users:
  - default
  - name: deployer
    gecos: Zealosh Deployment Operator
    primary_group: deployer
    groups: [sudo, docker]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true

timezone: Asia/Kolkata

write_files:
  - path: /etc/security/limits.d/99-zealosh.conf
    content: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 32768
      * hard nproc 32768

  - path: /etc/logrotate.d/docker-containers
    content: |
      /var/lib/docker/containers/*/*.log {
        rotate 7
        daily
        compress
        missingok
        delaycompress
        copytruncate
      }

runcmd:
  # 1. Configure NTP Time Synchronization
  - timedatectl set-ntp on
  - systemctl restart systemd-timesyncd

  # 2. Install Official Docker Engine & Docker Compose Plugin
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # 3. Configure Firewall Rules (SSH, HTTP, HTTPS)
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # 4. Prepare Workspace
  - mkdir -p /opt/zealosh
  - chown -R deployer:deployer /opt/zealosh

final_message: "Zealosh Application Host Cloud-Init Initialized Successfully."
