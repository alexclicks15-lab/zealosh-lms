version: '3.8'

# ==============================================================================
# Zealosh Platform — Production Docker Compose Manifest
# Architecture: Next.js 14 Core Hub (Supabase 1) + Moodle 5.3 LTS (Supabase 2)
# Ingress: Nginx Reverse Proxy Gateway (:80 / :443)
# Cache: Redis 7 Session & Application Cache
# ==============================================================================

services:
  # 1. Edge Ingress Reverse Proxy Gateway
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: zealosh-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/${NGINX_CONF_FILE:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      zealosh-hub:
        condition: service_healthy
      zealosh-moodle:
        condition: service_started
    networks:
      - zealosh-internal

  # 2. Zealosh Core Hub (Next.js 14 App Router)
  zealosh-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zealosh-hub
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ZEALOSH_ENVIRONMENT=${ZEALOSH_ENVIRONMENT:-staging}
      - ZEALOSH_DOMAIN=${ZEALOSH_DOMAIN:-lms.staging.zealosh.com}
      - APP_BASE_URL=${APP_BASE_URL:-https://lms.staging.zealosh.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://lms.staging.zealosh.com}
      - DATA_STORE_PATH=/app/data/zealosh-store.json
      - DATABASE_STORAGE=${DATABASE_STORAGE:-supabase}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET:-zealosh_super_secret_jwt_key_2026_enterprise}
      - MOODLE_BASE_URL=http://zealosh-moodle
      - BBB_BASE_URL=${BBB_BASE_URL:-${BBB_MEDIA_URL:-https://media.staging.zealosh.com/bigbluebutton/api}}
      - BBB_SECURITY_SALT=${BBB_SECURITY_SALT:-${BBB_SHARED_SECRET:-zealosh_bbb_shared_salt_2026}}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      zealosh-redis:
        condition: service_healthy
    networks:
      - zealosh-internal

  # 3. Zealosh Learning Engine (Moodle 5.3 LTS Container connecting to Dedicated Supabase PostgreSQL 17)
  zealosh-moodle:
    build:
      context: .
      dockerfile: deploy/moodle/Dockerfile
    container_name: zealosh-moodle
    restart: unless-stopped
    environment:
      - ZEALOSH_ENVIRONMENT=${ZEALOSH_ENVIRONMENT:-staging}
      - ZEALOSH_DOMAIN=${ZEALOSH_DOMAIN:-lms.staging.zealosh.com}
      - MOODLE_DATABASE_HOST=${MOODLE_DATABASE_HOST:-${MOODLE_DB_HOST:-aws-0-ap-south-1.pooler.supabase.com}}
      - MOODLE_DATABASE_PORT=${MOODLE_DATABASE_PORT:-${MOODLE_DB_PORT:-5432}}
      - MOODLE_DATABASE_NAME=${MOODLE_DATABASE_NAME:-${MOODLE_DB_NAME:-postgres}}
      - MOODLE_DATABASE_USER=${MOODLE_DATABASE_USER:-${MOODLE_DB_USER:-postgres}}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD:-${MOODLE_DB_PASSWORD}}
      - MOODLE_DATABASE_PREFIX=${MOODLE_DATABASE_PREFIX:-${MOODLE_DB_PREFIX:-mdl_}}
      - MOODLE_DATABASE_SSLMODE=${MOODLE_DATABASE_SSLMODE:-${MOODLE_DB_SSLMODE:-require}}
      - MOODLE_DATABASE_SSLROOTCERT=${MOODLE_DATABASE_SSLROOTCERT:-${MOODLE_DB_SSLROOTCERT:-}}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT:-https://lms.staging.zealosh.com/learn-engine}
      - REDIS_HOST=zealosh-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zealosh_redis_pass_2026}
    volumes:
      - moodledata_data:/var/moodledata
      - ./moodle-custom/theme_zealosh:/opt/theme_zealosh:ro
    tmpfs:
      - /run/moodle-installer:size=10M,uid=33,gid=33,mode=0700
    secrets:
      - moodle_admin_pass
    healthcheck:
      test: ["CMD", "/usr/local/bin/moodle-healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      zealosh-redis:
        condition: service_healthy
    networks:
      - zealosh-internal

  # 3b. Dedicated One-Time Controlled Upgrade Runner (Maintenance Profile Only)
  # Triggered explicitly via: docker compose run --rm zealosh-moodle-upgrade
  zealosh-moodle-upgrade:
    build:
      context: .
      dockerfile: deploy/moodle/Dockerfile
    container_name: zealosh-moodle-upgrade
    profiles: ["maintenance"]
    entrypoint: ["/usr/local/bin/moodle-upgrade-runner.sh"]
    environment:
      - ZEALOSH_ENVIRONMENT=${ZEALOSH_ENVIRONMENT:-staging}
      - ZEALOSH_DOMAIN=${ZEALOSH_DOMAIN:-lms.staging.zealosh.com}
      - MOODLE_DATABASE_HOST=${MOODLE_DATABASE_HOST:-aws-0-ap-south-1.pooler.supabase.com}
      - MOODLE_DATABASE_PORT=${MOODLE_DATABASE_PORT:-5432}
      - MOODLE_DATABASE_NAME=${MOODLE_DATABASE_NAME:-postgres}
      - MOODLE_DATABASE_USER=${MOODLE_DATABASE_USER:-postgres}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD}
      - MOODLE_DATABASE_PREFIX=${MOODLE_DATABASE_PREFIX:-mdl_}
      - MOODLE_DATABASE_SSLMODE=${MOODLE_DATABASE_SSLMODE:-require}
      - MOODLE_DATABASE_SSLROOTCERT=${MOODLE_DATABASE_SSLROOTCERT:-}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT:-https://lms.staging.zealosh.com/learn-engine}
      - REDIS_HOST=zealosh-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zealosh_redis_pass_2026}
    volumes:
      - moodledata_data:/var/moodledata
      - ./moodle-custom/theme_zealosh:/opt/theme_zealosh:ro
    depends_on:
      zealosh-redis:
        condition: service_healthy
    networks:
      - zealosh-internal

  # 4. Zealosh Learning Engine Dedicated Cron Runner (Isolated Scheduled Tasks)
  zealosh-moodle-cron:
    build:
      context: .
      dockerfile: deploy/moodle/Dockerfile
    container_name: zealosh-moodle-cron
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cron-runner.sh"]
    environment:
      - ZEALOSH_ENVIRONMENT=${ZEALOSH_ENVIRONMENT:-staging}
      - ZEALOSH_DOMAIN=${ZEALOSH_DOMAIN:-lms.staging.zealosh.com}
      - MOODLE_DATABASE_HOST=${MOODLE_DATABASE_HOST:-aws-0-ap-south-1.pooler.supabase.com}
      - MOODLE_DATABASE_PORT=${MOODLE_DATABASE_PORT:-5432}
      - MOODLE_DATABASE_NAME=${MOODLE_DATABASE_NAME:-postgres}
      - MOODLE_DATABASE_USER=${MOODLE_DATABASE_USER:-postgres}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD}
      - MOODLE_DATABASE_PREFIX=${MOODLE_DATABASE_PREFIX:-mdl_}
      - MOODLE_DATABASE_SSLMODE=${MOODLE_DATABASE_SSLMODE:-require}
      - MOODLE_DATABASE_SSLROOTCERT=${MOODLE_DATABASE_SSLROOTCERT:-}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT:-https://lms.staging.zealosh.com/learn-engine}
      - REDIS_HOST=zealosh-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zealosh_redis_pass_2026}
      - MOODLE_CRON_INTERVAL=60
    volumes:
      - moodledata_data:/var/moodledata
      - ./moodle-custom/theme_zealosh:/opt/theme_zealosh:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/cron-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      zealosh-moodle:
        condition: service_healthy
      zealosh-redis:
        condition: service_healthy
    networks:
      - zealosh-internal

  # 5. Shared Redis Cache & Session Store
  zealosh-redis:
    image: redis:7-alpine
    container_name: zealosh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-zealosh_redis_pass_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - zealosh-internal

networks:
  zealosh-internal:
    driver: bridge

volumes:
  redis_data:
  moodledata_data:

secrets:
  moodle_admin_pass:
    file: ./secrets/moodle_admin_password.txt

